// 一鍵解析：同時觸發主餐和飲料

function normalizeCompareText(value){
  return String(value||'').trim().toLowerCase().replace(/[\s　\-＿_·・()（）]/g,'');
}
function menuItemFingerprint(item){
  const specs=(item.specs||[]).map(s=>({cat:s.cat||'',opts:[...(s.opts||[])].map(String).sort()}));
  return JSON.stringify({price:Number(item.price)||0,specs});
}
function compareParsedWithHistory(runId){
  const parsed=(S.pendingItems||[]).filter(item=>item._parseRunId===runId);
  const ev=S.events.find(e=>e.id===S.adminEid);
  const fallbackStore=(document.getElementById('evStore')?.value||ev?.store_name||'').trim();
  let history=[];
  try{history=splitHistoryEntries(JSON.parse(localStorage.getItem('menuCache')||'[]'));}catch(e){}
  const groups={};
  parsed.forEach(item=>{
    const type=item.category==='飲料'||item._uploadType==='drink'?'飲料':'便當';
    const store=(item.restaurant&&item.restaurant!=='本日菜單'?item.restaurant:fallbackStore)||'未辨識店家';
    const key=normalizeCompareText(store)+'__'+type;
    if(!groups[key]) groups[key]={store,type,items:[]};
    groups[key].items.push(item);
  });
  return Object.values(groups).map(group=>{
    const old=history.find(entry=>entry.type===group.type&&normalizeCompareText(entry.store)===normalizeCompareText(group.store));
    const oldMap=new Map((old?.items||[]).map(item=>[normalizeCompareText(item.name),item]));
    const newMap=new Map(group.items.map(item=>[normalizeCompareText(item.name),item]));
    const added=group.items.filter(item=>!oldMap.has(normalizeCompareText(item.name))).map(item=>item.name);
    const removed=(old?.items||[]).filter(item=>!newMap.has(normalizeCompareText(item.name))).map(item=>item.name);
    const changed=group.items.filter(item=>{
      const previous=oldMap.get(normalizeCompareText(item.name));
      return previous&&menuItemFingerprint(previous)!==menuItemFingerprint(item);
    }).map(item=>item.name);
    return {store:group.store,type:group.type,hasHistory:!!old,added,removed,changed,currentCount:group.items.length,historyCount:(old?.items||[]).length};
  });
}

function showParseComparison(groups){
  const box=document.createElement('div');
  box.className='modal-bg';
  box.style.zIndex='520';
  const body=(groups||[]).map(group=>{
    const icon=group.type==='飲料'?'🧋':'🍱';
    let rows='';
    if(!group.hasHistory){
      rows=`<div style="color:var(--in);font-size:.74rem">首次解析，找不到同店家的${group.type}歷史菜單；本次共 ${group.currentCount} 項。</div>`;
    }else if(!group.added.length&&!group.removed.length&&!group.changed.length){
      rows='<div style="color:var(--gr);font-size:.74rem;font-weight:700">✓ 與歷史菜單相同，沒有增刪或價格規格變更</div>';
    }else{
      if(group.added.length) rows+=`<div style="color:var(--gr);font-size:.74rem;margin-bottom:5px"><strong>新增 ${group.added.length} 項：</strong>${esc(group.added.join('、'))}</div>`;
      if(group.removed.length) rows+=`<div style="color:var(--rd);font-size:.74rem;margin-bottom:5px"><strong>歷史中有、本次未出現 ${group.removed.length} 項：</strong>${esc(group.removed.join('、'))}</div>`;
      if(group.changed.length) rows+=`<div style="color:var(--am);font-size:.74rem"><strong>價格或規格可能變更 ${group.changed.length} 項：</strong>${esc(group.changed.join('、'))}</div>`;
    }
    return `<div style="border:1px solid var(--bo);border-radius:var(--rmd);padding:10px 12px;margin-bottom:8px;text-align:left"><div style="font-weight:800;font-size:.82rem;margin-bottom:7px">${icon} ${esc(group.store)} · ${group.type}</div>${rows}</div>`;
  }).join('')||'<div style="font-size:.78rem;color:var(--sll)">本次沒有可供比對的解析品項。</div>';
  box.innerHTML=`<div class="modal-box" style="max-width:480px;text-align:left;max-height:82vh;overflow-y:auto">
    <div style="text-align:center;font-size:2rem;margin-bottom:6px">🔎</div>
    <div class="modal-title" style="text-align:center">與歷史菜單比對完成</div>
    <p class="modal-sub" style="text-align:center;line-height:1.6">便當與飲料分開比對品項名稱、價格及規格。</p>
    ${body}
    <button class="btn btn-or btn-full" id="comparisonClose">確認，返回檢查</button>
  </div>`;
  document.body.appendChild(box);
  box.querySelector('#comparisonClose').onclick=()=>box.remove();
}

async function parseAll(){
  const hasMain=!!window._pendingMainFile;
  const hasDrink=!!window._pendingDrinkFile;
  if(!hasMain&&!hasDrink){toast('請先選擇至少一個菜單檔案','warn');return;}
  const runId='parse-'+Date.now();
  S.parseRunId=runId;
  S.parseStatus='parsing';
  S.parseComparison=null;
  // 重新解析時移除上一輪 AI 暫存，保留手動新增與歷史菜單載入項目。
  S.pendingItems=(S.pendingItems||[]).filter(item=>!item._parseRunId);
  const check=document.getElementById('parseCheckStatus');
  if(check) check.innerHTML=renderParseCheckStatus();
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML='<div style="background:#fff;border-radius:16px;padding:28px 32px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2)">'
    +'<div style="font-size:2rem;margin-bottom:10px">🤖</div>'
    +'<div id="parseOverlayMsg" style="font-weight:700;font-size:1rem;color:#1e293b">解析中…</div>'
    +'<div style="font-size:.78rem;color:#94a3b8;margin-top:6px">請稍候，AI 正在分析菜單</div>'
    +'</div>';
  document.body.appendChild(overlay);
  const results=[];
  try{
    if(hasMain){
      const msg=document.getElementById('parseOverlayMsg');
      if(msg) msg.textContent='🍱 解析主餐中…';
      results.push(await startParse('main'));
    }
    if(hasDrink){
      const msg=document.getElementById('parseOverlayMsg');
      if(msg) msg.textContent='🧋 解析飲料中…';
      results.push(await startParse('drink'));
    }
    const successful=results.every(result=>result&&result.success===true);
    const parsedCount=(S.pendingItems||[]).filter(item=>item._parseRunId===runId).length;
    if(successful&&parsedCount>0){
      S.parseStatus='complete';
      S.parseComparison=compareParsedWithHistory(runId);
    }else{
      S.parseStatus='failed';
      S.parseComparison=null;
    }
  }catch(err){
    console.error(err);
    S.parseStatus='failed';
    S.parseComparison=null;
    toast('一鍵解析未完成，請重新解析','err');
  }finally{
    overlay.remove();
    render();
    // 更新膠囊
    const capsDiv=document.getElementById('storeCapsules');
    if(capsDiv) capsDiv.innerHTML=renderStoreCapsules(document.getElementById('evStore')?.value||'');
    window._lastParseCats='';
    if(S.parseStatus==='complete') showParseComparison(S.parseComparison);
  }
}

async function handleImg(event, uploadType='main'){
  const file=event.target.files[0]; if(!file) return;
  const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
  const zone=(uploadType==='drink')?document.querySelector('#imgInpDrink')?.closest('.upload-zone'):document.querySelector('#imgInpMain')?.closest('.upload-zone');
  // 累加模式：不清空舊的 pendingItems（讓主餐+飲料合併）
  const stId=(uploadType==='drink')?'aiStatusDrink':'aiStatusMain';
  const statusEl=document.getElementById(stId)||document.getElementById('aiStatus');
  if(statusEl) statusEl.innerHTML='';
  if(zone) zone.innerHTML=`<div class="scan-ldr"><div class="spin"></div>${isPdf?'PDF 轉換中…':'圖片載入中…'}</div>`;
  if(isPdf){
    // PDF 用 PDF.js 轉換第一頁為圖片
    return await aiParsePdf(file,uploadType);
  }
  const reader=new FileReader();
  reader.onload=e=>{
    if(zone) zone.innerHTML=`<img src="${e.target.result}" class="menu-preview-img"><div style="margin-top:6px;font-size:.72rem;color:var(--in)">點擊更換圖片</div><input type="file" id="imgInp" accept="image/*,application/pdf" style="display:none" onchange="handleImg(event)">`;
  };
  reader.readAsDataURL(file);
  if(!DEMO){
    const eid=S.adminEid;
    const ext=file.name.split('.').pop();
    const path=`menus/${eid}_${Date.now()}.${ext}`;
    try{
      const{error:serr}=await sb.storage.from('menu-images').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg'});
      if(!serr){
        const{data:pub}=sb.storage.from('menu-images').getPublicUrl(path);
        await sb.from('menus').update({img_url:pub.publicUrl}).eq('id',eid);
        const ev=S.events.find(e=>e.id===eid); if(ev) ev.img_url=pub.publicUrl;
      }
    }catch(e){ console.warn('Storage upload skipped:', e.message); }
  }
  return await aiParse(file,uploadType);
}
async function aiParsePdf(file,uploadType='main'){
  const stId=(uploadType==='drink')?'aiStatusDrink':'aiStatusMain';
  const statusEl=document.getElementById(stId)||document.getElementById('aiStatus');
  if(statusEl) statusEl.innerHTML=`<div class="scan-ldr"><div class="spin"></div>PDF 解析中，請稍候…</div>`;
  try{
    // 用 PDF.js 把第一頁渲染成 canvas
    const pdfjsLib=window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const arrayBuffer=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    const page=await pdf.getPage(1);
    const viewport=page.getViewport({scale:2.0});
    const canvas=document.createElement('canvas');
    canvas.width=viewport.width; canvas.height=viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
    // 壓縮成 jpeg
    const MAX=1000;
    let w=canvas.width,h=canvas.height;
    if(w>MAX||h>MAX){
      const out=document.createElement('canvas');
      if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}
      out.width=w;out.height=h;
      out.getContext('2d').drawImage(canvas,0,0,w,h);
      const base64=out.toDataURL('image/jpeg',0.72).split(',')[1];
      // 更新預覽
      const zone=(uploadType==='drink')?document.querySelector('#imgInpDrink')?.closest('.upload-zone'):document.querySelector('#imgInpMain')?.closest('.upload-zone');
      if(zone) zone.innerHTML=`<img src="data:image/jpeg;base64,${base64}" class="menu-preview-img"><div style="margin-top:6px;font-size:.72rem;color:var(--in)">點擊更換圖片</div><input type="file" id="imgInp" accept="image/*,application/pdf" style="display:none" onchange="handleImg(event)">`;
      return await aiParseBase64(base64,'image/jpeg',uploadType);
    } else {
      const base64=canvas.toDataURL('image/jpeg',0.72).split(',')[1];
      const zone=(uploadType==='drink')?document.querySelector('#imgInpDrink')?.closest('.upload-zone'):document.querySelector('#imgInpMain')?.closest('.upload-zone');
      if(zone) zone.innerHTML=`<img src="data:image/jpeg;base64,${base64}" class="menu-preview-img"><div style="margin-top:6px;font-size:.72rem;color:var(--in)">點擊更換圖片</div><input type="file" id="imgInp" accept="image/*,application/pdf" style="display:none" onchange="handleImg(event)">`;
      return await aiParseBase64(base64,'image/jpeg',uploadType);
    }
  }catch(err){
    console.error(err);
    const stId=(uploadType==='drink')?'aiStatusDrink':'aiStatusMain';
  const statusEl=document.getElementById(stId)||document.getElementById('aiStatus');
    if(statusEl) statusEl.innerHTML=`<div style="font-size:.75rem;color:var(--rd);margin-top:7px">❌ PDF 解析失敗：${err.message}</div>`;
    toast('PDF 解析失敗，請改用圖片格式','err');
    return {success:false,error:err.message};
  }
}

async function aiParse(file,uploadType='main'){
  const base64=await toBase64(file);
  return await aiParseBase64(base64,'image/jpeg',uploadType);
}

async function aiParseBase64(base64,mime,uploadType='main'){
  const statusEl=document.getElementById(uploadType==='drink'?'aiStatusDrink':'aiStatusMain')||document.getElementById('aiStatus');
  if(statusEl) statusEl.innerHTML=`<div class="scan-ldr"><div class="spin"></div>AI 正在解析菜單，請稍候…</div>`;
  try{
    const proxyUrl=window._geminiProxyUrl;
    const res=await fetch(proxyUrl,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:mime,data:base64}},
        {type:'text',text:'請解析這張菜單圖片，只回傳純 JSON 陣列，不要有任何其他文字或 markdown：\\n[{"restaurant":"店家名稱","category":"便當","emoji":"emoji","name":"品項名稱","price":數字或0,"description":"描述","specs":[]}]\\nspecs 規格判斷規則（只加菜單上真實存在的）：\\n1. 若有多個價格欄（如八角飯盒/圓飯盒），price 填最小值，specs 加 {"cat":"飯盒","opts":["八角飯盒 $110","圓飯盒 $125"]} 把價格標在選項裡\\n2. 若有加量/加飯/加菜選項，specs 加 {"cat":"份量","opts":["正常","加量"]}\\n3. 飲料若有加料區，specs 加 {"cat":"加料","opts":["珍珠","椰果",...]} 只列菜單上有的料\\n4. 飲料若有杯型，specs 加 {"cat":"杯型","opts":["中杯","大杯"]}\\n5. 便當若有主食選擇（飯/麵/焗烤），specs 加 {"cat":"主食","opts":["白飯","麵",...]}\\n6. 沒有對應規格就保留 specs:[]\\ncategory 判斷規則：若整張菜單都是飲料（如飲料店菜單），所有品項 category 填「飲料」；加料區單獨列出的料也填「飲料」。若是便當/餐盒菜單，主餐填「便當」，湯品小菜填「點心」。只列出清楚可見的品項，看不清楚不要猜。忽略優惠說明。確保 JSON 完整不截斷。price 看不清楚填 0。無法辨識回傳 []。'}
        ,{type:'text',text:'價格解析補充規則：杯型或容器的完整售價請寫成「選項 $金額」，例如「大杯 $35」；加料、加飯或升級的額外費用請寫成「選項 +$金額」，例如「珍珠 +$10」。只保留菜單上清楚可見的價格，絕對不可猜測。'}
      ]}]})});
    const text=await res.text();
    if(!res.ok){
      let detail='';
      try{
        const errBody=JSON.parse(text);
        detail=errBody?.error?.message||errBody?.error||errBody?.message||'';
      }catch(e){ detail=text.slice(0,160); }
      throw new Error(`API 錯誤 ${res.status}${detail?'：'+detail:''}`);
    }
    let d;
    try{ d=JSON.parse(text); }
    catch(e){ throw new Error('伺服器回應格式錯誤：'+text.slice(0,120)); }
    let raw=(d.content?.[0]?.text||'[]').trim();
    // 清除所有 markdown 包裝
    raw=raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/\s*```\s*$/,'').trim();
    if(raw.toLowerCase().startsWith('json')) raw=raw.slice(4).trim();
    // 如果 JSON 被截斷，嘗試修復（補上結尾的 ]）
    if(!raw.endsWith(']')){
      const lastComma=raw.lastIndexOf(',');
      const lastBrace=raw.lastIndexOf('}');
      if(lastBrace>lastComma){
        raw=raw.slice(0,lastBrace+1)+']';
      } else if(lastComma>0){
        raw=raw.slice(0,lastComma)+']';
      } else {
        raw='[]';
      }
    }
    let parsed;
    try{ parsed=JSON.parse(raw); }
    catch(e){ throw new Error('菜單解析失敗，品項可能過多，請嘗試分開上傳'); }
    if(!Array.isArray(parsed)||!parsed.length){
      if(statusEl) statusEl.innerHTML=`<div style="font-size:.75rem;color:var(--am);margin-top:7px">⚠️ AI 無法識別，請手動新增品項</div>`;
      return {success:false,empty:true};
    }
    const eid=S.adminEid;
    if(!S.items[eid]) S.items[eid]=[];
    const newItems=parsed
      .filter(it=>it&&it.name)  // 過濾掉不完整的品項
      .map((it,i)=>({
        id:'ai-'+Date.now()+'-'+i,
        menu_id:eid,
        restaurant:it.restaurant||'本日菜單',
        category:it.category||'其他',
        emoji:it.emoji||'🍱',
        name:it.name||'未知品項',
        description:document.getElementById('md-'+i)?.value||it.description||'',
        price:Number(it.price)||0,
        specs:Array.isArray(it.specs)?it.specs.filter(s=>s.cat&&Array.isArray(s.opts)&&s.opts.length):[],
        sort_order:S.items[eid].length+i,
        ai_parsed:true,
        _parseRunId:S.parseRunId,
        _uploadType:uploadType
      }));
    // 累加：把本次解析結果加入 pendingItems（支援主餐+飲料分開上傳）
    S.pendingItems=[...S.pendingItems, ...newItems];
    // 解析完後更新膠囊顯示（讓「本次解析」區塊出現）
    const capsDiv=document.getElementById('storeCapsules');
    if(capsDiv) capsDiv.innerHTML=renderStoreCapsules(document.getElementById('evStore')?.value||'');
    const cats=[...new Set(newItems.map(i=>i.category))].join('、');
    if(statusEl) statusEl.innerHTML=`<div style="font-size:.75rem;color:var(--gr);margin-top:7px">✅ 解析完成 ${newItems.length} 個品項（${cats}），確認後按「💾 儲存」加入場次</div>`;
    render();
    window._lastParseCats=(window._lastParseCats?window._lastParseCats+'、':'')+cats;
    return {success:true,count:newItems.length,items:newItems};
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.innerHTML=`<div style="font-size:.75rem;color:var(--rd);margin-top:7px">❌ 解析失敗：${err.message}</div>`;
    toast('AI 解析失敗：'+err.message,'err');
    return {success:false,error:err.message};
  }
}
function toBase64(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const canvas=document.createElement('canvas');
      const MAX=850;
      let w=img.width,h=img.height;
      if(w>MAX||h>MAX){
        if(w>h){h=Math.round(h*MAX/w);w=MAX;}
        else{w=Math.round(w*MAX/h);h=MAX;}
      }
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/jpeg',0.7);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror=reject;
    img.src=url;
  });
}

/* ── EXPORT ── */
function copyKitchen(){
  const kitch={};const ords=S.orders[S.adminEid]||[];
  ords.forEach(o=>(o.order_items||[]).forEach(oi=>{const k=oi.item_name+(oi.specs_str?'('+oi.specs_str+')':'');kitch[k]=(kitch[k]||0)+oi.quantity;}));
  let txt='【廚房備餐清單】\n\n';
  const ev=S.events.find(e=>e.id===S.adminEid);
  if(ev) txt+=`場次：${ev.title}　負責老師：${ev.organizer||'—'}\n\n`;
  Object.entries(kitch).forEach(([n,q])=>txt+=`${n} × ${q}\n`);
  txt+=`\n合計：${Object.values(kitch).reduce((s,q)=>s+q,0)} 份`;
  copyText(txt);
}
function exportCSV(){
  const ords=S.orders[S.adminEid]||[];
  const ev=S.events.find(e=>e.id===S.adminEid);
  const menuItems=S.items[S.adminEid]||[];
  const itemMap=Object.fromEntries(menuItems.map(item=>[item.id,item]));
  // 每一個品項列都保留場次、姓名與分工分類，方便直接用試算表篩選便當／飲料。
  const rows=[['場次','場次日期','承辦','點餐時間','點餐姓名','店家','分工分類','原始分類','品項','規格','糖度冰塊／品項備註','數量','單價','小計','訂單備註']];
  const summary={};
  let totalQty=0,totalAmount=0;
  ords.forEach(o=>(o.order_items||[]).forEach(oi=>{
    const source=itemMap[oi.item_id]||menuItems.find(item=>item.name===oi.item_name)||{};
    const restaurant=source.restaurant||ev?.store_name||'未設定店家';
    const category=source.category||'其他';
    const workType=category==='飲料'?'飲料':'便當';
    const qty=Number(oi.quantity)||0;
    const unitPrice=Number(oi.unit_price)||0;
    const subtotal=qty*unitPrice;
    rows.push([ev?.title||'',ev?.date||'',ev?.organizer||'',fmtTime(o.created_at),o.user_name||'',restaurant,workType,category,
      oi.item_emoji+oi.item_name,oi.specs_str||'',oi.note||'',qty,unitPrice,subtotal,o.note||'']);
    const key=[restaurant,workType,category,oi.item_name,oi.specs_str||'',oi.note||'',unitPrice].join('__');
    if(!summary[key]) summary[key]={event:ev?.title||'',date:ev?.date||'',names:new Set(),restaurant,workType,category,name:oi.item_name,specs:oi.specs_str||'',itemNote:oi.note||'',qty:0,unitPrice,subtotal:0};
    if(o.user_name) summary[key].names.add(o.user_name);
    summary[key].qty+=qty;
    summary[key].subtotal+=subtotal;
    totalQty+=qty;
    totalAmount+=subtotal;
  }));
  rows.push([],['餐點彙整']);
  rows.push(['場次','場次日期','點餐姓名','店家','分工分類','原始分類','餐點','規格','糖度冰塊／品項備註','總份數','單價','金額小計']);
  Object.values(summary)
    .sort((a,b)=>a.workType.localeCompare(b.workType,'zh-TW')||a.restaurant.localeCompare(b.restaurant,'zh-TW')||a.category.localeCompare(b.category,'zh-TW')||a.name.localeCompare(b.name,'zh-TW'))
    .forEach(x=>rows.push([x.event,x.date,[...x.names].join('、'),x.restaurant,x.workType,x.category,x.name,x.specs,x.itemNote,x.qty,x.unitPrice,x.subtotal]));
  rows.push(['彙整總計','','','','','','','','',totalQty,'',totalAmount]);
  dlCSV(rows,`點餐紀錄_${ev?.title||''}`);
}
function dlCSV(rows,name){
  if(rows.length<=1){toast('沒有資料','warn');return;}
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`${name}_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'-')}.csv`;a.click();toast('CSV 已匯出','ok');
}
function copyText(txt){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('已複製','ok');}catch(e){toast('複製失敗','err');}}

/* ── UTILS ── */
function toast(msg,type='info'){const w=document.getElementById('toastWrap');const el=document.createElement('div');el.className='toast '+type;const ic={ok:'✅',err:'❌',warn:'⚠️',info:'ℹ️'};el.innerHTML=`<span>${ic[type]||'ℹ️'}</span><span>${msg}</span>`;w.appendChild(el);setTimeout(()=>el.remove(),2800);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});}catch{return '';}}
function countUniqueDiners(orders){
  const people=new Set();
  (orders||[]).forEach((order,index)=>{
    const name=String(order?.user_name||'').trim().toLocaleLowerCase('zh-TW');
    const className=String(order?.class_name||'').trim().toLocaleLowerCase('zh-TW');
    // 同班同名視為同一人；缺少姓名的舊資料則逐筆保留，避免少算。
    people.add(name?className+'\u0000'+name:'__anonymous__'+(order?.id||index));
  });
  return people.size;
}
