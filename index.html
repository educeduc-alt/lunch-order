<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>資源教室點餐小助手</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --or:#f97316;--ord:#ea580c;--orl:#fff7ed;--orll:#ffedd5;
  --gr:#16a34a;--grl:#dcfce7;--rd:#dc2626;--rdl:#fee2e2;
  --am:#d97706;--aml:#fef3c7;--in:#4f46e5;--inl:#eef2ff;
  --sl:#1e293b;--slm:#475569;--sll:#94a3b8;
  --bg:#f8f7f4;--ca:#ffffff;--bo:#e2e8f0;--bos:#f1f5f9;
  --rsm:8px;--rmd:12px;--rlg:16px;--rxl:22px;
  --shsm:0 1px 4px rgba(0,0,0,.07);--shmd:0 4px 16px rgba(0,0,0,.10);--shlg:0 12px 40px rgba(0,0,0,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:18.75px!important}
body{font-family:'Noto Sans TC',sans-serif!important;background:var(--bg);color:var(--sl);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:1rem!important}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}

/* ── TOPBAR ── */
.topbar{background:rgba(255,255,255,.96);border-bottom:1px solid var(--bo);position:sticky;top:0;z-index:90;box-shadow:none;backdrop-filter:blur(10px)}
.topbar-inner{max-width:940px;margin:0 auto;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;color:var(--or)}
.brand-icon{width:32px;height:32px;border-radius:10px;background:var(--or);display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 2px 8px rgba(249,115,22,.35)}
.brand-sub{font-size:.68rem;color:var(--sll);font-weight:600;letter-spacing:.3px}

/* ── TABS ── */
.tab-bar{background:var(--ca);border-bottom:1px solid var(--bo)}
.tab-bar-inner{max-width:940px;margin:0 auto;padding:0 16px;display:flex}
.tab-btn{padding:11px 18px;font-size:.8rem;font-weight:700;color:var(--sll);border-bottom:3px solid transparent;transition:all .18s;white-space:nowrap}
.tab-btn:hover{color:var(--slm)}
.tab-btn.on{color:var(--or);border-bottom-color:var(--or)}
.tab-btn.on-admin{color:var(--sl);border-bottom-color:var(--sl)}

/* ── MAIN ── */
.main{max-width:1000px;margin:0 auto;width:100%;padding:26px 18px 100px}

/* ── SESSION LIST (首頁) ── */
.page-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.35rem;letter-spacing:-.02em;margin-bottom:4px}
.page-sub{font-size:.8rem;color:var(--sll);margin-bottom:18px}
.meal-policy{background:linear-gradient(135deg,#fffbeb,#fff7ed);border:2px solid #fbbf24;border-radius:var(--rlg);padding:14px 16px;margin-bottom:16px;box-shadow:0 4px 16px rgba(217,119,6,.12)}
.meal-policy-title{display:flex;align-items:center;gap:7px;font-size:.92rem;font-weight:900;color:#92400e;margin-bottom:8px}
.meal-policy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.meal-policy-item{background:rgba(255,255,255,.82);border:1px solid #fde68a;border-radius:var(--rmd);padding:9px 11px;color:#78350f;font-size:.78rem;line-height:1.55}
.meal-policy-item strong{display:block;font-size:.88rem;color:#b45309;margin-bottom:1px}
.meal-policy-foot{font-size:.72rem;color:#92400e;font-weight:700;margin-top:8px}
@media(max-width:440px){.meal-policy-grid{grid-template-columns:1fr}}

.event-list{display:flex;flex-direction:column;gap:10px}
.event-card{background:var(--ca);border:1px solid var(--bo);border-radius:var(--rlg);overflow:hidden;cursor:pointer;box-shadow:0 2px 10px rgba(15,23,42,.045);transition:border-color .18s,box-shadow .18s}
.event-card:hover{border-color:#fdba74;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.event-card.closed-card{opacity:.72;cursor:pointer}
.ec-top{padding:14px 16px;border-bottom:1px solid var(--bos);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ec-left{flex:1}
.ec-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px}
.badge-open{background:var(--grl);color:var(--gr)}
.badge-closed{background:var(--rdl);color:var(--rd)}
.ec-title{font-weight:700;font-size:.95rem;margin-bottom:3px;color:var(--or)}
.ec-organizer{font-size:.72rem;color:var(--sll);display:flex;align-items:center;gap:4px}
.ec-right{align-self:stretch;text-align:right;flex-shrink:0;display:flex;align-items:flex-end;justify-content:flex-end}
.ec-date{font-size:.72rem;font-weight:800;color:var(--sl);white-space:nowrap}
.ec-deadline{font-size:.72rem;color:var(--rd);font-weight:700;white-space:nowrap}
.ec-deadline-label{font-size:.65rem;color:var(--sll);margin-bottom:1px}
.ec-bot{padding:10px 16px;background:var(--ca);border-top:1px solid var(--bos);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.ec-store{font-size:.75rem;color:var(--slm);display:flex;align-items:center;gap:4px}
.ec-count{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:20px}
.ec-count.ok{background:var(--grl);color:var(--gr)}
.ec-count.warn{background:var(--aml);color:var(--am)}
.ec-count.none{background:var(--bos);color:var(--sll)}
.ec-arrow{color:var(--or);font-weight:700;font-size:1rem}
.empty-events{text-align:center;padding:50px 16px;color:var(--sll)}
.empty-events .ei{font-size:3rem;display:block;margin-bottom:10px}
.empty-events p{font-size:.85rem;font-weight:600}

/* ── ORDER PAGE ── */
.order-page-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rsm);background:var(--bos);border:1px solid var(--bo);font-size:.75rem;font-weight:700;color:var(--slm);transition:all .15s}
.back-btn:hover{background:var(--orll);color:var(--ord);border-color:var(--or)}
.event-info-banner{flex:1;background:var(--orl);border:1.5px solid var(--orll);border-radius:var(--rmd);padding:8px 12px;font-size:.78rem;color:var(--ord)}
.event-info-banner strong{font-size:.85rem;display:block;margin-bottom:1px}
.event-activity-note{margin-top:5px;padding:6px 8px;border-radius:7px;background:rgba(255,255,255,.72);color:#7c2d12;font-size:.74rem;line-height:1.55;white-space:pre-line}
.event-order-help{margin-top:6px;padding-top:6px;border-top:1px dashed #fdba74;color:#9a3412;font-size:.72rem;line-height:1.55;font-weight:600}

/* ── NOTICE ── */
.notice{background:var(--inl);border:1.5px solid #c7d2fe;border-radius:var(--rmd);padding:10px 13px;font-size:.78rem;color:#3730a3;line-height:1.6;margin-bottom:14px;display:flex;gap:8px}

/* ── ID CARD ── */
.id-card{background:var(--ca);border:1px solid var(--bo);border-radius:var(--rlg);padding:15px 16px;margin-bottom:16px;box-shadow:none;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.id-card .fld{flex:1;min-width:120px}
.id-card label{display:block;font-size:.68rem;font-weight:700;color:var(--sll);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.activity-meal-help{width:100%;display:flex;align-items:flex-start;gap:9px;background:#f8fafc;border:1px solid var(--bo);border-radius:var(--rmd);padding:10px 12px;color:var(--slm);font-size:.75rem;line-height:1.65}
.activity-meal-help strong{color:#0e7490}
.inp,.sel{width:100%;border:1.5px solid var(--bo);border-radius:var(--rsm);padding:8px 10px;font-size:.85rem;color:var(--sl);background:var(--ca);outline:none;transition:border-color .18s,box-shadow .18s}
.inp:focus,.sel:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(249,115,22,.12)}

/* ── MENU ── */
.rest-block{margin-bottom:20px}
.rest-name{font-size:.78rem;font-weight:700;color:var(--slm);background:var(--bos);border-radius:var(--rsm);padding:5px 10px;display:inline-flex;align-items:center;gap:5px;margin-bottom:9px}
.cat-toggle{width:100%;min-height:46px;padding:9px 11px 9px 14px;border:1px solid var(--bo);border-left:4px solid var(--or);border-radius:var(--rmd);background:var(--ca);display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;box-shadow:none;transition:border-color .18s,box-shadow .18s}
.cat-toggle:hover{border-color:#fdba74;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.cat-toggle:focus-visible{outline:3px solid rgba(249,115,22,.28);outline-offset:2px}
.cat-toggle.is-collapsed{background:var(--ca);border-color:var(--bo);border-left-color:var(--sll)}
.cat-toggle-main{display:flex;align-items:center;gap:7px;font-size:.9rem;font-weight:800;color:var(--sl);min-width:0}
.cat-toggle-store{font-size:.72rem;font-weight:700;color:var(--sll);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-toggle-count{background:var(--or);color:#fff;border-radius:20px;padding:2px 8px;font-size:.68rem;font-weight:800;line-height:1.4}
.cat-toggle-state{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:74px;padding:6px 10px;border-radius:20px;background:var(--orll);color:var(--ord);font-size:.71rem;font-weight:800;white-space:nowrap;box-shadow:none}
.cat-toggle.is-collapsed .cat-toggle-state{background:var(--bos);color:var(--slm);box-shadow:none}
.cat-toggle-arrow{display:inline-block;font-size:.82rem;transition:transform .18s}
.cat-toggle:not(.is-collapsed) .cat-toggle-arrow{transform:rotate(90deg)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
@media(max-width:440px){.menu-grid{grid-template-columns:1fr 1fr}}
.m-card{background:var(--ca);border:1px solid var(--bo);border-radius:var(--rlg);padding:14px 12px 12px;cursor:pointer;box-shadow:0 2px 9px rgba(15,23,42,.035);transition:border-color .18s,transform .18s,box-shadow .18s;position:relative;overflow:hidden;user-select:none}
.m-card::after{content:'';position:absolute;inset:0;background:var(--orl);opacity:0;transition:opacity .18s;pointer-events:none}
.m-card:hover{border-color:var(--or);transform:translateY(-2px);box-shadow:var(--shmd)}
.m-card.sel{border-color:var(--or);box-shadow:var(--shmd)}
.m-card.sel::after{opacity:1}
.m-card>*{position:relative;z-index:1}
.m-emoji{font-size:1.7rem;display:block;margin-bottom:6px}
.m-name{font-weight:700;font-size:.85rem;line-height:1.3;margin-bottom:2px}
.m-desc{font-size:.68rem;color:var(--sll);line-height:1.4;margin-bottom:7px}
.m-price{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem;color:var(--or)}
.overage-tag{display:inline-flex;align-items:center;gap:3px;margin-top:4px;padding:3px 7px;border-radius:20px;background:var(--rdl);color:var(--rd);font-size:.65rem;font-weight:800}
.m-spec{font-size:.65rem;color:var(--in);margin-top:2px}
.qty-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.qb{width:25px;height:25px;border-radius:50%;border:1.5px solid var(--bo);background:var(--ca);display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;color:var(--slm);transition:all .15s}
.qb:hover{background:var(--or);color:#fff;border-color:var(--or)}
.qn{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;min-width:18px;text-align:center}

/* ── SPEC SHEET ── */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.46);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--ca);border-radius:var(--rxl) var(--rxl) 0 0;padding:20px 20px 30px;width:100%;max-width:480px;max-height:82vh;overflow-y:auto;box-shadow:0 -12px 50px rgba(15,23,42,.18);animation:su .23s ease}
@keyframes su{from{transform:translateY(36px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:38px;height:4px;background:var(--bo);border-radius:2px;margin:0 auto 15px}
.sheet-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:1.05rem;border-left:4px solid var(--or);padding-left:9px;margin-bottom:13px}
.spec-sec{margin-bottom:12px}
.spec-lbl{font-size:.68rem;font-weight:700;color:var(--sll);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.spec-opts{display:flex;flex-wrap:wrap;gap:5px}
.spec-opt{padding:6px 12px;border:1.5px solid var(--bo);border-radius:20px;font-size:.78rem;font-weight:600;background:var(--ca);color:var(--slm);transition:all .15s}
.spec-opt:hover{border-color:var(--or);color:var(--or)}
.spec-opt.on{background:var(--or);color:#fff;border-color:var(--or)}
.note-inp{width:100%;border:1.5px solid var(--bo);border-radius:var(--rsm);padding:8px 10px;font-size:.82rem;resize:none;outline:none;transition:border-color .18s;color:var(--sl)}
.note-inp:focus{border-color:var(--or)}
.sheet-qty{display:flex;align-items:center;gap:11px;margin:12px 0}
.sqb{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--bo);background:var(--ca);font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sqb:hover{background:var(--or);color:#fff;border-color:var(--or)}
.sqn{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.25rem;min-width:28px;text-align:center}

/* ── CART ── */
.cart-panel{background:var(--ca);border:1px solid var(--bo);border-radius:var(--rlg);padding:13px 15px;margin-top:14px;box-shadow:var(--shsm)}
.cart-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--bos);font-size:.85rem;gap:8px}
.cart-row:last-child{border:none}
.cart-spec{font-size:.7rem;color:var(--sll);margin-top:1px}
.cart-note{font-size:.7rem;color:var(--ord);margin-top:1px}
.cart-total{display:flex;justify-content:space-between;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;padding-top:9px;border-top:1.5px solid var(--bo);margin-top:3px}
.cart-total span:first-child{color:var(--sl)}
.cart-total span:last-child{color:var(--or)}

/* ── SUBMIT BAR ── */
.sub-bar{position:fixed;bottom:0;left:0;right:0;background:var(--ca);border-top:1px solid var(--bo);padding:11px 16px;z-index:80;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.sub-bar-inner{max-width:940px;margin:0 auto}
.sub-btn{width:100%;padding:13px;border-radius:var(--rmd);background:var(--or);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:.98rem;transition:all .18s;box-shadow:0 4px 14px rgba(249,115,22,.38)}
.sub-btn:hover{background:var(--ord);transform:translateY(-1px)}
.sub-btn:disabled{background:var(--sll);box-shadow:none;cursor:not-allowed;transform:none}

/* ── RECORDS ── */
.rec-card{background:var(--ca);border:1px solid var(--bo);border-radius:var(--rlg);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shsm);position:relative}
.rec-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;padding-right:26px;gap:8px}
.rec-title{font-weight:700;font-size:.88rem}
.rec-organizer{font-size:.7rem;color:var(--sll);margin-top:1px}
.rec-badge{font-size:.66rem;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--aml);color:var(--am)}
.rec-lines{font-size:.8rem;color:var(--slm);line-height:1.75;margin-bottom:7px}
.rec-foot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--bos);font-size:.85rem;font-weight:700}
.rec-price{color:var(--or);font-family:'Nunito',sans-serif}
.rec-del{position:absolute;top:11px;right:11px;color:var(--sll);padding:3px;border-radius:4px;font-size:.85rem}
.rec-del:hover{color:var(--rd);background:var(--rdl)}
.del-cfm{position:absolute;top:8px;right:8px;background:var(--ca);border:1.5px solid var(--bo);border-radius:var(--rsm);padding:8px 10px;box-shadow:var(--shmd);z-index:10;min-width:158px}
.del-cfm p{font-size:.7rem;color:var(--rd);font-weight:700;margin-bottom:6px}
.del-cfm-btns{display:flex;gap:5px}
.dcb-k{font-size:.7rem;padding:3px 9px;border-radius:6px;border:1.5px solid var(--bo);background:var(--bos);color:var(--slm)}
.dcb-d{font-size:.7rem;padding:3px 9px;border-radius:6px;background:var(--rd);color:#fff}

/* ── ADMIN ── */
.panel{background:var(--ca);border:1px solid var(--bo);border-radius:var(--rlg);margin-bottom:13px;overflow:hidden;box-shadow:var(--shsm)}
.panel-head{padding:11px 15px;border-bottom:1px solid var(--bos);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:6px}
.panel-body{padding:13px 15px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:13px}
@media(min-width:500px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-box{background:var(--ca);border:1px solid var(--bo);border-radius:var(--rmd);padding:13px;text-align:center;box-shadow:var(--shsm)}
.stat-n{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.55rem;line-height:1;margin-bottom:2px}
.stat-l{font-size:.68rem;color:var(--sll);font-weight:600}
.k-row{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;border-bottom:1px solid var(--bos)}
.k-row:last-child{border:none}
.k-item{font-weight:700;font-size:.88rem}
.k-spec{font-size:.7rem;color:var(--sll);margin-top:1px}
.k-qty{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.35rem;color:var(--or)}
.k-sub{font-size:.7rem;color:var(--sll)}
.bar-wrap{height:4px;background:var(--bos);border-radius:2px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:2px;background:var(--or)}
.exp-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.exp-btn{padding:7px 14px;border-radius:var(--rsm);border:1.5px solid var(--bo);background:var(--ca);font-size:.75rem;font-weight:700;color:var(--slm);display:flex;align-items:center;gap:4px;transition:all .18s;box-shadow:var(--shsm)}
.exp-btn:hover{border-color:var(--sl);color:var(--sl)}
.atbl{width:100%;border-collapse:collapse;font-size:.78rem}
.atbl th{background:var(--bos);padding:8px 11px;text-align:left;font-weight:700;font-size:.68rem;color:var(--sll);text-transform:uppercase;letter-spacing:.4px;border-bottom:1.5px solid var(--bo)}
.atbl td{padding:8px 11px;border-bottom:1px solid var(--bos);vertical-align:top}
.atbl tr:hover td{background:var(--bos)}

/* 場次管理卡片 */
.ev-mgmt-card{background:var(--bos);border:1.5px solid var(--bo);border-radius:var(--rmd);padding:14px;margin-bottom:10px;position:relative}
.ev-mgmt-title{font-weight:700;font-size:.88rem;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.ev-mgmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media(max-width:480px){.ev-mgmt-grid{grid-template-columns:1fr}}
.mg-inp{border:1.5px solid var(--bo);border-radius:6px;padding:6px 9px;font-size:.82rem;outline:none;background:var(--ca);transition:border-color .18s;width:100%}
.mg-inp:focus{border-color:var(--or)}
.mg-textarea{min-height:76px;resize:vertical;line-height:1.55}
.mg-lbl{font-size:.68rem;font-weight:700;color:var(--sll);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px}
.mgmt-item-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--ca);border-radius:6px;padding:7px 8px;margin-bottom:5px}
.mi-em{width:46px;text-align:center}
.mi-rest{width:120px}
.mi-name{flex:1;min-width:90px}
.mi-price{width:64px}

  ]);
  // 確保 specs 是陣列（Supabase jsonb 有時回傳字串）
  S.items[eid] = (its||[]).map(it=>({...it, specs:parseSpecs(it.specs)}));
  S.orders[eid] = ords||[];
}

}
async function dbInsertOrder(order, items){
  if(DEMO){
    const o={id:'d'+Date.now(),...order,created_at:new Date().toISOString(),order_items:items.map((it,i)=>({id:'di'+i,...it}))};
    if(!S.orders[order.menu_id]) S.orders[order.menu_id]=[];
    S.orders[order.menu_id].unshift(o); return{error:null};
  }
  const{data:o,error}=await sb.from('orders').insert(order).select().single();
  if(error) return{error};
  await sb.from('order_items').insert(items.map(it=>({...it,order_id:o.id})));
  await loadEventDetail(order.menu_id);
  return{error:null};
}
async function dbDeleteOrder(id, menuId){
  if(DEMO){ S.orders[menuId]=S.orders[menuId].filter(o=>o.id!==id); return{error:null}; }
  // 先刪 order_items 再刪 orders（避免 409 外鍵衝突）
  await sb.from('order_items').delete().eq('order_id',id);
  const r=await sb.from('orders').delete().eq('id',id);
  if(!r.error) await loadEventDetail(menuId);
  return r;
}

function parseSpecs(specs){
  if(!specs) return [];
  if(Array.isArray(specs)) return specs;
  try{ const p=JSON.parse(specs); return Array.isArray(p)?p:[]; }
  catch(e){ return []; }
}

function isEventClosed(ev){
  if(!ev) return true;
  return ev.is_closed===true;
}

function fmtEventDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d]=String(dateStr).split('-').map(Number);
  if(!y||!m||!d) return String(dateStr);
  const week=['日','一','二','三','四','五','六'];
  const weekday=week[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}（${weekday}）`;
}

          ${ev.organizer?`<div class="ec-organizer">👤 負責老師：${esc(ev.organizer)}</div>`:''}
        </div>
        ${ev.date?`<div class="ec-right"><div class="ec-date">📅 ${esc(fmtEventDate(ev.date))}</div></div>`:''}
      </div>
    </div>`;
  });
  html+=`</div>`;
  return html;
}
function openEvent(eid){
  S.activeEventId=eid; S.cart={}; S.menuSearchQ='';
  render();
}

/* ── ORDER PAGE ── */
function renderOrderPage(){
  const ev=S.events.find(e=>e.id===S.activeEventId);
  if(!ev) return '<div class="empty"><span class="ei">❌</span><p>找不到此場次</p></div>';
  const items=S.items[S.activeEventId]||[];
  const closed=isEventClosed(ev);

  let html=`
    <div class="order-page-header">
      <button class="back-btn" onclick="S.activeEventId=null;S.cart={};render()">← 返回場次</button>
      <div class="event-info-banner">
        ${ev.date?`<span style="display:block;font-size:.7rem;font-weight:800;color:var(--or);margin-bottom:2px">📅 ${esc(fmtEventDate(ev.date))}</span>`:''}
        <strong>${esc(ev.title)}</strong>
        ${ev.organizer?`負責老師：${esc(ev.organizer)}`:''}
      </div>
    </div>`;

  if(closed) html+=`<div style="background:var(--rdl);border:1.5px solid #fca5a5;border-radius:var(--rmd);padding:10px 13px;font-size:.8rem;color:var(--rd);font-weight:700;margin-bottom:12px;text-align:center">⛔ 此場次已截止，無法點餐</div>`;

  // 已點餐入口：只提供查看已送出的內容。
  const myExisting=(S.orders[S.activeEventId]||[]).find(o=>o.user_name===S.myName);
  if(myExisting){
    html+=`<button class="btn btn-gr btn-full" style="margin-bottom:12px;padding:11px" onclick="showSubmittedOrderNotice('${myExisting.id}')">✅ 查看已送出的餐點</button>`;
  }

  html+=`<div class="id-card">
    <div class="fld"><label>姓名</label><input class="inp" id="uName" placeholder="王小明" value="${esc(S.myName)}" oninput="S.myName=this.value"></div>
    <div class="activity-meal-help"><span style="font-size:1.15rem">☀️</span><div><strong>活動餐點說明</strong><br>${ev.activity_note?esc(ev.activity_note):'承辦人尚未填寫本場次活動說明。'}<br>請確認餐點規格與數量後再送出。</div></div>
  </div>`;



  // 菜單品項 — 按分類顯示
  const CAT_ORDER=['便當','飲料','點心','其他'];
  const CAT_ICON={'便當':'🍱','飲料':'🧋','點心':'🍰','其他':'🍽️'};
  const q=(S.menuSearchQ||'').trim().toLowerCase();
  const filteredItems=q ? items.filter(it=>(it.name||'').toLowerCase().includes(q)||(it.description||'').toLowerCase().includes(q)||(it.restaurant||'').toLowerCase().includes(q)) : items;

  if(!items.length){
    html+='<div class="empty"><span class="ei">🍽️</span><p>尚無品項，承辦人尚未設定菜單</p></div>';
  } else if(filteredItems.length===0){
    html+='<div class="empty"><span class="ei">🔍</span><p>找不到「'+q+'」相關餐點</p></div>';
  } else {
    const byCat={};
    filteredItems.forEach(it=>{const cat=it.category||'其他';if(!byCat[cat])byCat[cat]=[];byCat[cat].push(it);});
    const orderedCats=[...CAT_ORDER,...Object.keys(byCat).filter(c=>!CAT_ORDER.includes(c))].filter(c=>byCat[c]);
    orderedCats.forEach(cat=>{
      const its=byCat[cat];
      const catStores=[...new Set(its.map(item=>String(item.restaurant||'').trim()).filter(store=>store&&store!=='未知店家'&&store!=='本日菜單'))];
      if(!catStores.length&&ev.store_name) catStores.push(ev.store_name);
      const collapsed=S.collapsedCats[cat]||false;
      const catCount=its.reduce((s,item)=>{const keys=Object.keys(S.cart).filter(k=>k.startsWith(item.id+'__'));return s+keys.reduce((ss,k)=>ss+(S.cart[k]?.qty||0),0);},0);
      html+=`<div class="rest-block">
        <button type="button" class="cat-toggle${collapsed?' is-collapsed':''}"
          aria-expanded="${!collapsed}" aria-label="${collapsed?'展開':'收合'}${esc(cat)}分類"
          onclick="S.collapsedCats['${cat}']=!S.collapsedCats['${cat}'];render()">
          <span class="cat-toggle-main"><span>${CAT_ICON[cat]||'🍽️'}</span><span>${esc(cat)}</span>${catStores.length?`<span class="cat-toggle-store">· ${esc(catStores.join('／'))}</span>`:''}${catCount>0?`<span class="cat-toggle-count">已選 ${catCount}</span>`:''}</span>
          <span class="cat-toggle-state"><span class="cat-toggle-arrow">▶</span>${collapsed?'展開':'收合'}</span>
        </button>
        ${collapsed?'':`<div class="menu-grid" style="margin-top:8px">`}`;
      if(!collapsed){
        its.forEach(item=>{
          const keys=Object.keys(S.cart).filter(k=>k.startsWith(item.id+'__'));
          const totalQty=keys.reduce((s,k)=>s+(S.cart[k]?.qty||0),0);
          const hasSpec=item.specs&&item.specs.length>0;
          const subsidyLimit=cat==='便當'?120:(cat==='飲料'?40:0);
          const overage=subsidyLimit&&item.price>subsidyLimit?item.price-subsidyLimit:0;
          html+=`<div class="m-card${totalQty>0?' sel':''}">
          <span class="m-emoji">${esc(item.emoji)}</span>
          <div class="m-name">${esc(item.name)}</div>
          ${item.description?`<div class="m-desc">${esc(item.description)}</div>`:''}
          ${item.price>0?`<div class="m-price">$${item.price}</div>`:'<div class="m-price" style="color:var(--sll)">詢價</div>'}
          ${overage?`<div class="overage-tag">⚠️ 需補額 $${overage}</div>`:''}
          ${hasSpec?`<div class="m-spec">點擊選規格 ›</div>`:''}
          <div class="qty-row" onclick="event.stopPropagation()">
            <button class="qb" onclick="event.stopPropagation();adjCart('${item.id}',-1)">−</button>
            <span class="qn">${totalQty}</span>
            <button class="qb" onclick="event.stopPropagation();${hasSpec?`openSpec('${item.id}')`:`quickAdd('${item.id}')`}">＋</button>
          </div>
        </div>`;
        });
        html+='</div>';
      }
      html+='</div>';
    });
  }

  // 購物車預覽
  const cartKeys=Object.keys(S.cart);
  if(cartKeys.length){
    let total=0;
    html+=`<div class="cart-panel"><div class="fbe" style="margin-bottom:9px"><span style="font-weight:700;font-size:.85rem">📋 確認清單</span><button class="btn btn-out btn-sm" onclick="S.cart={};render()">清空</button></div>`;
    cartKeys.forEach(k=>{
      const ci=S.cart[k]; if(!ci) return;
      total+=ci.price*ci.qty;
      html+=`<div class="cart-row">
        <div><span>${esc(ci.emoji)} ${esc(ci.name)} <strong style="color:var(--or)">× ${ci.qty}</strong></span>
          ${ci.specsStr?`<div class="cart-spec">${esc(ci.specsStr)}</div>`:''}
          ${ci.note?`<div class="cart-note">備註：${esc(ci.note)}</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:7px">
          ${ci.price>0?`<span style="font-weight:700">$${ci.price*ci.qty}</span>`:''}
          <button class="qb" onclick="removeKey('${k}')" style="border-color:transparent;color:var(--sll)">✕</button>
        </div>
      </div>`;
    });
    if(total>0) html+=`<div class="cart-total"><span>合計</span><span>$${total}</span></div>`;
    html+='</div>';
  }
  return html;
}

/* ── CART OPS ── */
function filterMenu(val){
  S.menuSearchQ=val||'';
  const q=(val||'').trim().toLowerCase();
  // 直接操控 DOM，不重繪頁面，不打斷輸入法
  document.querySelectorAll('.m-card').forEach(card=>{
    const name=(card.querySelector('.m-name')?.textContent||'').toLowerCase();
    const desc=(card.querySelector('.m-desc')?.textContent||'').toLowerCase();
    card.style.display=(!q||name.includes(q)||desc.includes(q))?'':'none';
  });
  // 隱藏空分類
  document.querySelectorAll('.rest-block').forEach(block=>{
    const visible=[...block.querySelectorAll('.m-card')].some(c=>c.style.display!=='none');
    block.style.display=visible?'':'none';
  });
  // 空結果提示
  let noResult=document.getElementById('searchEmpty');
  const anyVisible=[...document.querySelectorAll('.m-card')].some(c=>c.style.display!=='none');
  if(q && !anyVisible){
    if(!noResult){
      noResult=document.createElement('div');
      noResult.id='searchEmpty';
      noResult.className='empty';
      noResult.innerHTML='<span class="ei">🔍</span><p>找不到「'+(S.menuSearchQ||q)+'」相關餐點</p>';
      const menuArea=document.querySelector('.rest-block')?.parentNode||document.getElementById('main');
      if(menuArea) menuArea.appendChild(noResult);
    }
  } else {
    noResult?.remove();
  }
}


/* ══════════════════════════════════
   套餐組合流程
══════════════════════════════════ */
function startCombo(id){
  const ev=S.events.find(e=>e.id===S.activeEventId);
  if(isEventClosed(ev)){toast('此場次已截止','err');return;}
  const item=(S.items[S.activeEventId]||[]).find(i=>i.id===id);
  if(!item) return;
  // 有規格的主餐先選規格，選完再進套餐流程
  if(item.specs&&item.specs.length>0){
    S.specItem=item; S.specSel={}; S.specQty=1; S.specNote='';
    (item.specs||[]).forEach(sp=>{if(sp.opts.length)S.specSel[sp.cat]=sp.opts[0];});
    S.specItem._comboMode=true;  // 標記為套餐模式
    renderSheet();
    document.getElementById('specOverlay').style.display='flex';
    // 修改確認按鈕文字
    const btn=document.getElementById('specOverlay').querySelector('.btn-or');
    if(btn) btn.textContent='確認主餐，繼續選配餐 →';
    return;
  }
  // 無規格直接開套餐流程，從主餐頁開始
  S.comboMain=null;
  S.comboSides=[]; S.comboDrinks=[];
  S.comboStep='main';
  // 預設選中這個品項
  S.comboMain={item, specsStr:'', qty:1, note:''};
  renderComboSheet();
  document.getElementById('comboOverlay').style.display='flex';
}

function renderComboSheet(){
  const el=document.getElementById('comboSheetContent');
  if(!el) return;
  const items=S.items[S.activeEventId]||[];
  const mainItems=items.filter(i=>i.category==='便當');
  const sideItems=items.filter(i=>i.category==='點心');
  const drinkItems=items.filter(i=>i.category==='飲料');
  // 判斷是否為速食（有配餐品項）→ 三頁；否則兩頁
  const isFastFood=sideItems.length>0;

  // 步驟指示器
  const steps=isFastFood?['主餐','配餐','飲料']:['主餐','飲料'];
  const stepIdx=isFastFood
    ?{main:0,side:1,drink:2}[S.comboStep]||0
    :{main:0,drink:1}[S.comboStep]||0;

  let html=`<div style="display:flex;align-items:center;gap:0;margin-bottom:14px">`;
  steps.forEach((s,i)=>{
    const active=i===stepIdx, done=i<stepIdx;
    const bg=active?'var(--or)':(done?'var(--gr)':'var(--bo)');
    const fg=(active||done)?'#fff':'var(--sll)';
    const lbl=active?'var(--or)':(done?'var(--gr)':'var(--sll)');
    const fw=active?700:400;
    html+='<div style="flex:1;text-align:center">'
      +'<div style="width:28px;height:28px;border-radius:50%;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;background:'+bg+';color:'+fg+'">'+(done?'✓':(i+1))+'</div>'
      +'<div style="font-size:.68rem;font-weight:'+fw+';color:'+lbl+'">'+s+'</div>'
      +'</div>';
    if(i<steps.length-1) html+=`<div style="flex:0 0 20px;height:2px;background:${done?'var(--gr)':'var(--bo)'};margin-bottom:14px"></div>`;
  });
  html+=`</div>`;

  if(S.comboStep==='main'){
    html+=`<div class="sheet-title">🍔 選主餐</div>`;
    if(!mainItems.length){
      html+=`<div style="font-size:.8rem;color:var(--sll);text-align:center;padding:16px">此場次無主餐品項</div>`;
    } else {
      html+=`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">`;
      mainItems.forEach(item=>{
        const sel=S.comboMain&&S.comboMain.item.id===item.id;
        html+=`<div onclick="selectComboMain('${item.id}')"
          style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:2px solid ${sel?'var(--or)':'var(--bo)'};border-radius:var(--rmd);background:${sel?'var(--orl)':'var(--ca)'};cursor:pointer">
          <div style="flex:1">
            <span style="font-size:1.2rem">${esc(item.emoji)}</span>
            <span style="font-weight:600;font-size:.9rem;margin-left:7px">${esc(item.name)}</span>
            ${item.description?`<div style="font-size:.72rem;color:var(--sll);margin-top:2px;margin-left:26px">${esc(item.description)}</div>`:''}
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:8px">
            ${item.price>0?`<div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;color:var(--or)">$${item.price}</div>`:''}
            <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${sel?'var(--or)':'var(--bo)'};background:${sel?'var(--or)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#fff;margin-top:3px;margin-left:auto">${sel?'✓':''}</div>
          </div>
        </div>`;
      });
      html+=`</div>`;
    }
    html+=`<button class="btn btn-or btn-full" ${!S.comboMain?'disabled':''}
      onclick="S.comboStep=(S.items[S.activeEventId]||[]).filter(i=>i.category==='點心').length?'side':'drink';renderComboSheet()"
      style="${!S.comboMain?'opacity:.5':''}"
    >${isFastFood?'下一步：選配餐 →':'下一步：選飲料 →'}</button>
    <button class="btn btn-out btn-full" style="margin-top:7px" onclick="closeCombo()">取消</button>`;

  } else if(S.comboStep==='side'){
    html+=`<div class="sheet-title">🍟 加配餐？<span style="font-size:.75rem;color:var(--sll);font-weight:400;margin-left:6px">可多選，或直接跳過</span></div>`;
    // 主餐摘要
    if(S.comboMain) html+=`<div style="background:var(--orl);border-radius:var(--rsm);padding:7px 11px;margin-bottom:11px;font-size:.8rem;color:var(--ord)">✅ 主餐：${esc(S.comboMain.item.emoji)} ${esc(S.comboMain.item.name)}</div>`;
    if(!sideItems.length){
      html+=`<div style="font-size:.8rem;color:var(--sll);text-align:center;padding:16px">此場次無配餐品項</div>`;
    } else {
      html+=`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">`;
      sideItems.forEach(item=>{
        const sel=S.comboSides.find(s=>s.item.id===item.id);
        html+=`<div onclick="toggleComboItem('side','${item.id}')"
          style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1.5px solid ${sel?'var(--or)':'var(--bo)'};border-radius:var(--rmd);background:${sel?'var(--orl)':'var(--ca)'};cursor:pointer">
          <div><span style="font-size:1.1rem">${esc(item.emoji)}</span>
            <span style="font-weight:600;font-size:.88rem;margin-left:6px">${esc(item.name)}</span>
            ${item.price>0?`<span style="color:var(--or);font-weight:700;font-size:.82rem;margin-left:6px">$${item.price}</span>`:''}
          </div>
          <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${sel?'var(--or)':'var(--bo)'};background:${sel?'var(--or)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#fff;flex-shrink:0">${sel?'✓':''}</div>
        </div>`;
      });
      html+=`</div>`;
    }
    if(S.comboSides.length) html+=`<div style="font-size:.75rem;color:var(--gr);margin-bottom:9px">已選：${S.comboSides.map(s=>s.item.name).join('、')}</div>`;
    html+=`<div style="display:flex;gap:7px">
      <button class="btn btn-out" onclick="S.comboStep='main';renderComboSheet()">← 返回</button>
      <button class="btn btn-or btn-full" onclick="S.comboStep='drink';renderComboSheet()">下一步：選飲料 →</button>
    </div>`;

  } else if(S.comboStep==='drink'){
    html+=`<div class="sheet-title">🧋 加飲料？<span style="font-size:.75rem;color:var(--sll);font-weight:400;margin-left:6px">可多選，或直接完成</span></div>`;
    // 摘要
    const sideNames=S.comboSides.map(s=>s.item.name).join('、');
    html+=`<div style="background:var(--orl);border-radius:var(--rsm);padding:7px 11px;margin-bottom:11px;font-size:.78rem;color:var(--ord);line-height:1.7">`;
    if(S.comboMain) html+=`✅ ${esc(S.comboMain.item.emoji)} ${esc(S.comboMain.item.name)}<br>`;
    if(sideNames) html+=`🍟 ${sideNames}<br>`;
    html+=`</div>`;
    if(!drinkItems.length){
      html+=`<div style="font-size:.8rem;color:var(--sll);text-align:center;padding:16px">此場次無飲料品項</div>`;
    } else {
      html+=`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">`;
      drinkItems.forEach(item=>{
        const sel=S.comboDrinks.find(d=>d.item.id===item.id);
        html+=`<div onclick="toggleComboItem('drink','${item.id}')"
          style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1.5px solid ${sel?'var(--or)':'var(--bo)'};border-radius:var(--rmd);background:${sel?'var(--orl)':'var(--ca)'};cursor:pointer">
          <div><span style="font-size:1.1rem">${esc(item.emoji)}</span>
            <span style="font-weight:600;font-size:.88rem;margin-left:6px">${esc(item.name)}</span>
            ${item.price>0?`<span style="color:var(--or);font-weight:700;font-size:.82rem;margin-left:6px">$${item.price}</span>`:''}
            ${item.specs&&item.specs.length?`<span style="font-size:.65rem;color:var(--in);margin-left:4px">規格可選</span>`:''}
          </div>
          <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${sel?'var(--or)':'var(--bo)'};background:${sel?'var(--or)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#fff;flex-shrink:0">${sel?'✓':''}</div>
        </div>`;
      });
      html+=`</div>`;
    }
    // 小計
    const total=(S.comboMain?S.comboMain.item.price||0:0)+
      S.comboSides.reduce((s,x)=>s+(x.item.price||0),0)+
      S.comboDrinks.reduce((s,x)=>s+(x.item.price||0),0);
    if(total>0) html+=`<div style="text-align:right;font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;color:var(--or);margin-bottom:9px">小計 $${total}</div>`;
    html+=`<div style="display:flex;gap:7px">
      <button class="btn btn-out" onclick="S.comboStep=(S.items[S.activeEventId]||[]).filter(i=>i.category==='點心').length?'side':'main';renderComboSheet()">← 返回</button>
      <button class="btn btn-or btn-full" onclick="confirmCombo()">✅ 加入清單</button>
    </div>`;
  }

  el.innerHTML=html;
}

function selectComboMain(id){
  const items=S.items[S.activeEventId]||[];
  const item=items.find(i=>i.id===id);
  if(!item) return;
  if(item.specs&&item.specs.length){
    // 有規格彈出選規格，之後再設定 comboMain
    S.specItem=item; S.specSel={}; S.specQty=1; S.specNote='';
    (item.specs||[]).forEach(sp=>{if(sp.opts.length)S.specSel[sp.cat]=sp.opts[0];});
    S.specItem._comboMode=true;
    renderSheet();
    document.getElementById('comboOverlay').style.display='none';
    document.getElementById('specOverlay').style.display='flex';
    const btn=document.getElementById('specOverlay').querySelector('.btn-or');
    if(btn) btn.textContent='確認，繼續選配餐 →';
    return;
  }
  S.comboMain={item, specsStr:'', qty:1, note:''};
  renderComboSheet();
}

function toggleComboItem(type, id){
  const items=S.items[S.activeEventId]||[];
  const item=items.find(i=>i.id===id);
  if(!item) return;
  const arr=type==='side'?S.comboSides:S.comboDrinks;
  const idx=arr.findIndex(x=>x.item.id===id);
  if(idx>=0){
    // 已選 → 取消
    arr.splice(idx,1);
    renderComboSheet();
  } else {
    // 有規格 → 彈出規格 mini-picker
    if(item.specs&&item.specs.length){
      showComboSpecPicker(type, item, arr);
    } else {
      arr.push({item, specsStr:''});
      renderComboSheet();
    }
  }
}

function showComboSpecPicker(type, item, arr){
  // 在 comboSheetContent 裡疊加一個規格選擇層
  const specSel={};
  item.specs.forEach(sp=>{
    if(isMultiAddonSpec(sp.cat,item)) specSel[sp.cat]=[];
    else if(sp.opts.length) specSel[sp.cat]=sp.opts[0];
  });
  window.comboSpecSel=specSel;

  function buildPickerHTML(){
    let h=`<div style="position:absolute;inset:0;background:rgba(255,255,255,.97);border-radius:var(--rxl);padding:18px;z-index:10;display:flex;flex-direction:column">
      <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;border-left:4px solid var(--or);padding-left:9px;margin-bottom:14px">${esc(item.emoji)} ${esc(item.name)}${item.price>0?' <span style=\"color:var(--or)\">$'+item.price+'</span>':''}</div>`;
    item.specs.forEach(sp=>{
      const multi=isMultiAddonSpec(sp.cat,item);
      h+=`<div style="margin-bottom:12px"><div style="font-size:.68rem;font-weight:700;color:var(--sll);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">${esc(sp.cat)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">`;
      sp.opts.forEach(o=>{
        const on=multi?(specSel[sp.cat]||[]).includes(o):specSel[sp.cat]===o;
        h+=`<button class="spec-opt${on?' on':''}" data-combo-cat="${esc(sp.cat)}" data-combo-opt="${esc(o)}" aria-pressed="${on}" onclick="selectComboSpecOption(this,${multi})">${esc(o)}</button>`;
      });
      h+=`</div></div>`;
      if(multi) h+=`<div style="font-size:.66rem;color:var(--sll);margin:-8px 0 12px">可複選，再點一次可取消</div>`;
    });
    h+=`<div id="comboSpecPreview">${renderComboSpecPreview()}</div>
      <div style="display:flex;gap:7px;margin-top:auto;padding-top:12px">
        <button class="btn btn-out" onclick="this.closest('[style*=absolute]').remove()">取消</button>
        <button class="btn btn-or btn-full" onclick="confirmComboSpec()">確認加入</button>
      </div>
    </div>`;
    return h;
  }

  // 把規格選擇疊在 sheet 上面
  const sheet=document.querySelector('#comboOverlay .sheet');
  if(!sheet) return;
  sheet.style.position='relative';
  const picker=document.createElement('div');
  picker.innerHTML=buildPickerHTML();
  sheet.appendChild(picker.firstChild);

  // 全域暫存
  window.selectComboSpecOption=function(btn,multi){
    const cat=btn.dataset.comboCat;
    const opt=btn.dataset.comboOpt;
    if(multi){
      const selected=Array.isArray(window.comboSpecSel[cat])?[...window.comboSpecSel[cat]]:[];
      const index=selected.indexOf(opt);
      if(index>=0) selected.splice(index,1); else selected.push(opt);
      window.comboSpecSel[cat]=selected;
      btn.classList.toggle('on',selected.includes(opt));
      btn.setAttribute('aria-pressed',String(selected.includes(opt)));
    }else{
      window.comboSpecSel[cat]=opt;
      document.querySelectorAll('#comboOverlay [data-combo-cat]').forEach(el=>{
        if(el.dataset.comboCat!==cat) return;
        const on=el.dataset.comboOpt===opt;
        el.classList.toggle('on',on);
        el.setAttribute('aria-pressed',String(on));
      });
    }
    const preview=document.getElementById('comboSpecPreview');
    if(preview) preview.innerHTML=renderComboSpecPreview();
  };
  window.confirmComboSpec=function(){
    const unpricedAddons=getUnpricedAddons(window.comboSpecSel);
    if(unpricedAddons.length){toast('所選加料尚未設定價格，請先聯絡承辦人','warn');return;}
    const specsStr=formatSpecSelections(window.comboSpecSel);
    const finalPrice=calcSpecPrice(item,window.comboSpecSel);
    arr.push({item:{...item,price:finalPrice}, specsStr});
    const el=document.querySelector('#comboOverlay .sheet [style*="absolute"]');
    if(el) el.remove();
    renderComboSheet();
  };
  window.renderComboSpecPreview=renderComboSpecPreview;
  function renderComboSpecPreview(){
    const selections=formatSpecSelections(window.comboSpecSel||specSel)||'尚未選擇加料';
    const price=calcSpecPrice(item,window.comboSpecSel||specSel);
    return '<div style="font-size:.75rem;color:var(--gr);margin-top:4px">已選：'+esc(selections)+' · $'+price+'</div>';
  };
}

async function confirmCombo(){
  const ev=S.events.find(e=>e.id===S.activeEventId);
  if(isEventClosed(ev)){toast('此場次已截止','err');return;}
  if(!S.comboMain){toast('請先選擇主餐','warn');return;}
  const comboItems=[S.comboMain.item,...S.comboSides.map(x=>x.item),...S.comboDrinks.map(x=>x.item)];
  const comboGroups={};
  comboItems.forEach(item=>{
    if(!getSubsidyLimit(item)) return;
    const key=getStoreCategoryKey(item);
    if(!comboGroups[key]) comboGroups[key]={item,addedTotal:0};
    comboGroups[key].addedTotal+=Number(item.price)||0;
  });
  const overageLines=Object.values(comboGroups).map(g=>getStoreTotalNotice(g.item,g.addedTotal)).filter(Boolean);
  if(overageLines.length && !(await showOverageNotice(overageLines))) return;
  // 加入主餐
  const mainKey=S.comboMain.item.id+'__'+S.comboMain.specsStr+'__'+Date.now();
  S.cart[mainKey]={itemId:S.comboMain.item.id,name:S.comboMain.item.name,emoji:S.comboMain.item.emoji,
    qty:S.comboMain.qty,price:S.comboMain.item.price,specsStr:S.comboMain.specsStr,note:''};
  // 加入配餐
  S.comboSides.forEach((s,i)=>{
    const k=s.item.id+'__'+s.specsStr+'__'+(Date.now()+i+1);
    S.cart[k]={itemId:s.item.id,name:s.item.name,emoji:s.item.emoji,qty:1,price:s.item.price,specsStr:s.specsStr,note:''};
  });
  // 加入飲料
  S.comboDrinks.forEach((d,i)=>{
    const k=d.item.id+'__'+d.specsStr+'__'+(Date.now()+i+100);
    S.cart[k]={itemId:d.item.id,name:d.item.name,emoji:d.item.emoji,qty:1,price:d.item.price,specsStr:d.specsStr,note:''};
  });
  closeCombo();
  const total=(S.comboMain.item.price||0)+
    S.comboSides.reduce((s,x)=>s+(x.item.price||0),0)+
    S.comboDrinks.reduce((s,x)=>s+(x.item.price||0),0);
  toast(`已加入 ${1+S.comboSides.length+S.comboDrinks.length} 項${total>0?' ($'+total+')':''}` ,'ok');
  render();
}

function closeCombo(){
  document.getElementById('comboOverlay').style.display='none';
  S.comboStep=null; S.comboMain=null; S.comboSides=[]; S.comboDrinks=[];
}

function getSubsidyLimit(item){
  return item?.category==='便當'?120:(item?.category==='飲料'?40:0);
}

function getStoreCategoryKey(item){
  return `${item?.category||''}__${item?.restaurant||'未設定店家'}`;
}

function getCartStoreCategoryTotal(item){
  const items=S.items[S.activeEventId]||[];
  const targetKey=getStoreCategoryKey(item);
  return Object.values(S.cart).reduce((sum,cartItem)=>{
    const sourceItem=items.find(x=>x.id===cartItem.itemId);
    return sum+(getStoreCategoryKey(sourceItem)===targetKey?(Number(cartItem.price)||0)*(cartItem.qty||0):0);
  },0);
}

function getStoreTotalNotice(item, addedTotal){
  const limit=getSubsidyLimit(item);
  if(!limit) return null;
  const before=getCartStoreCategoryTotal(item);
  const total=before+(Number(addedTotal)||0);
  if(total<=limit) return null;
  return {kind:'store-total',category:item.category,store:item.restaurant||'未設定店家',before,addedTotal:Number(addedTotal)||0,total,limit,overage:total-limit};
}

function showOverageNotice(lines){

    const box=document.createElement('div');
    box.className='modal-bg';
    box.innerHTML=`<div class="modal-box" style="max-width:380px;text-align:left;border-top:6px solid var(--am)">
      <div style="text-align:center;font-size:2.35rem;margin-bottom:7px">💡</div>
      <div class="modal-title" style="text-align:center;color:#92400e">本場次活動餐費補助與補額提醒</div>
      <p class="modal-sub" style="text-align:center;line-height:1.6">同一家便當店合計補助上限 $120，同一家飲料店合計補助上限 $40。</p>
      <div style="background:#fffbeb;border:1.5px solid #fbbf24;border-radius:var(--rmd);padding:10px 12px;margin-bottom:14px">
        ${lines.map(x=>`<div style="font-size:.8rem;color:#78350f;padding:5px 0;border-bottom:1px dashed #fde68a"><strong>${x.category==='飲料'?'🧋':'🍱'} ${esc(x.store)}</strong><br>本次同店${x.category}累計 $${x.total}－補助上限 $${x.limit}＝<strong style="color:var(--rd)">需補額 $${x.overage}</strong></div>`).join('')}
      </div>
      <button class="btn btn-or btn-full" id="overageConfirm">了解，仍要加入</button>
      <button class="btn btn-out btn-full" style="margin-top:7px" id="overageCancel">返回重新選擇</button>
    </div>`;

}

async function quickAdd(id){
  const ev=S.events.find(e=>e.id===S.activeEventId);
  if(isEventClosed(ev)){toast('此場次已截止','err');return;}
  const nameEl=document.getElementById('uName');
  if(nameEl&&nameEl.value) S.myName=nameEl.value;
  // 檢查上限 5 份
  const existKeys=Object.keys(S.cart).filter(k=>k.startsWith(id+'__'));
  const existQty=existKeys.reduce((s,k)=>s+(S.cart[k]?.qty||0),0);
  if(existQty>=5){toast('同一品項最多5份','warn');return;}
  const item=(S.items[S.activeEventId]||[]).find(i=>i.id===id);
  const notices=[getStoreTotalNotice(item,item?.price)].filter(Boolean);
  if(notices.length && !(await showOverageNotice(notices))) return;
  const key=id+'__';
  if(!S.cart[key]){S.cart[key]={itemId:id,name:item.name,emoji:item.emoji,qty:0,price:item.price,specsStr:'',note:''};}
  S.cart[key].qty++;render();
}
async function adjCart(id,d){
  const ev=S.events.find(e=>e.id===S.activeEventId);
  if(d>0&&isEventClosed(ev)){toast('此場次已截止','err');return;}
  const nameEl=document.getElementById('uName');
  if(nameEl&&nameEl.value) S.myName=nameEl.value;
  const keys=Object.keys(S.cart).filter(k=>k.startsWith(id+'__'));
  if(!keys.length&&d>0){quickAdd(id);return;}
  if(keys.length){
    const k=keys[keys.length-1];
    const newQty=S.cart[k].qty+d;
    if(d>0&&newQty>5){toast('同一品項最多5份','warn');return;}
    if(d>0){
      const item=(S.items[S.activeEventId]||[]).find(i=>i.id===id);
      const totalNotice=getStoreTotalNotice(item,S.cart[k].price||item.price);
      if(totalNotice && !(await showOverageNotice([totalNotice]))) return;
    }
    S.cart[k].qty=Math.max(0,newQty);
    if(!S.cart[k].qty) delete S.cart[k];
  }
  render();
}
function removeKey(k){delete S.cart[k];render();}

/* ── SPEC SHEET ── */
function openSpec(id){
  const ev=S.events.find(e=>e.id===S.activeEventId);
  if(isEventClosed(ev)){toast('此場次已截止','err');return;}
  S.specItem=(S.items[S.activeEventId]||[]).find(i=>i.id===id);
  S.specSel={};
  (S.specItem.specs||[]).forEach(sp=>{
    if(isMultiAddonSpec(sp.cat,S.specItem)) S.specSel[sp.cat]=[];
    else if(sp.opts.length) S.specSel[sp.cat]=sp.opts[0];
  });
  S.specQty=1;S.specNote='';
  renderSheet();
  document.getElementById('specOverlay').style.display='flex';
}
// 從規格文字解析價格：
// 「大杯 $35」代表替代單價；「珍珠 +$10」代表在單價上加價。
function parseOptPrice(optStr){
  const text=String(optStr||'');
  const m=text.match(/([＋+\-－]?)\s*\$\s*(\d+)/);
  if(!m) return null;
  return {amount:Number(m[2])||0,isDelta:m[1]==='+'||m[1]==='＋'||/加\s*\$/.test(text)};
}
function isAddonSpec(cat){
  return /加料|加價|配料|配餐|升級/.test(String(cat||''));
}
function isMultiAddonSpec(cat,item){
  return item?.category==='飲料'&&/加料|配料/.test(String(cat||''));
}
function isEmptyAddonOption(opt){
  return /^(不加|無|不要|原味|不需要|none)$/i.test(String(opt||'').trim());
}
function getUnpricedAddons(specSel){
  const result=[];
  Object.entries(specSel||{}).forEach(([cat,value])=>{
    const opts=Array.isArray(value)?value:[value];
    opts.forEach(opt=>{
      if(isAddonSpec(cat)&&opt&&!isEmptyAddonOption(opt)&&!parseOptPrice(opt)) result.push([cat,opt]);
    });
  });
  return result;
}

function formatSpecSelections(specSel){
  return Object.values(specSel||{}).flatMap(value=>Array.isArray(value)?value:[value]).filter(Boolean).join('/');
}

function toggleSpecOption(cat,opt){
  const selected=Array.isArray(S.specSel[cat])?[...S.specSel[cat]]:[];
  const index=selected.indexOf(opt);
  if(index>=0) selected.splice(index,1); else selected.push(opt);
  S.specSel[cat]=selected;
  renderSheet();
}

// 根據目前選擇的規格計算實際價格
function calcSpecPrice(item, specSel){
  let price=Number(item.price)||0;
  let extras=0;
  Object.entries(specSel||{}).forEach(([cat,optVal])=>{
    const values=Array.isArray(optVal)?optVal:[optVal];
    values.forEach(value=>{
      const info=parseOptPrice(value);
      if(!info) return;
      if(info.isDelta||isAddonSpec(cat)) extras+=info.amount;
      else price=info.amount;
    });
  });
  return price+extras;
}

function renderSheet(){
  const item=S.specItem;
  const curPrice=calcSpecPrice(item, S.specSel);
  const unpricedAddons=getUnpricedAddons(S.specSel);
  document.getElementById('sheetTitle').innerHTML=`${esc(item.emoji)} ${esc(item.name)}${curPrice>0?` <span style="color:var(--or);font-size:.9rem">$${curPrice}</span>`:''}`;
  let html='';
  (item.specs||[]).forEach(sp=>{
    const multi=isMultiAddonSpec(sp.cat,item);
    html+=`<div class="spec-sec"><div class="spec-lbl">${esc(sp.cat)}</div><div class="spec-opts">
      ${sp.opts.map(o=>{
        const on=multi?(S.specSel[sp.cat]||[]).includes(o):S.specSel[sp.cat]===o;
        const action=multi?`toggleSpecOption('${esc(sp.cat)}','${esc(o)}')`:`S.specSel['${esc(sp.cat)}']='${esc(o)}';renderSheet()`;
        return `<button class="spec-opt${on?' on':''}" aria-pressed="${on}" onclick="${action}">${esc(o)}${multi&&on?' ✓':''}</button>`;
      }).join('')}
    </div></div>`;
    if(multi) html+=`<div style="font-size:.66rem;color:var(--sll);margin:-8px 0 12px">可複選，再點一次可取消</div>`;
  });
  if(unpricedAddons.length){
    html+=`<div style="margin:-2px 0 12px;padding:8px 10px;border-radius:8px;background:var(--rdl);color:var(--rd);font-size:.7rem;font-weight:700">⚠️ ${esc(unpricedAddons.map(([,opt])=>opt).join('、'))} 尚未設定加價，請承辦人補上價格。</div>`;
  }
  html+=`<div class="spec-sec"><div class="spec-lbl">數量</div>
    <div class="sheet-qty">
      <button class="sqb" onclick="if(S.specQty>1){S.specQty--;renderSheet()}">−</button>
      <span class="sqn">${S.specQty}</span>
      <button class="sqb" onclick="if(S.specQty<5){S.specQty++;renderSheet()}">＋</button>
      ${curPrice>0?`<span style="font-family:'Nunito',sans-serif;font-weight:800;color:var(--or);margin-left:6px">$${curPrice*S.specQty}</span>`:''}
    </div>
  </div>
  <div class="spec-sec"><div class="spec-lbl">備註</div>
    <textarea class="note-inp" rows="2" placeholder="${S.specItem&&S.specItem.category==='飲料'?'甜度冰塊（如：微糖微冰）':'例：不要辣…'}" oninput="S.specNote=this.value">${esc(S.specNote)}</textarea>
  </div>`;
  document.getElementById('sheetBody').innerHTML=html;
}
async function confirmSpec(){
  const item=S.specItem;
  const unpricedAddons=getUnpricedAddons(S.specSel);
  if(unpricedAddons.length){toast('所選加料尚未設定價格，請先聯絡承辦人','warn');return;}
  const specsStr=formatSpecSelections(S.specSel);
  const finalPrice=calcSpecPrice(item, S.specSel);  // 用規格動態價格
  // 套餐模式
  if(item._comboMode){
    item._comboMode=false;
    closeSpec();
    S.comboMain={item:{...item,price:finalPrice}, specsStr, qty:S.specQty, note:S.specNote};
    S.comboSides=[]; S.comboDrinks=[];
    S.comboStep='side';
    renderComboSheet();
    document.getElementById('comboOverlay').style.display='flex';
    return;
  }
  const notices=[getStoreTotalNotice(item,finalPrice*S.specQty)].filter(Boolean);
  if(notices.length && !(await showOverageNotice(notices))) return;
  const key=item.id+'__'+specsStr+'__'+Date.now();
  S.cart[key]={itemId:item.id,name:item.name,emoji:item.emoji,qty:S.specQty,price:finalPrice,specsStr,note:S.specNote};
  closeSpec();render();toast('已加入清單 ✓','ok');
}
function closeSpec(){document.getElementById('specOverlay').style.display='none';}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:800">

async function submitOrder(){
  const ev=S.events.find(e=>e.id===S.activeEventId);
  if(isEventClosed(ev)){toast('此場次已截止','err');return;}
  const nameEl=document.getElementById('uName');
  S.myName=nameEl?.value.trim()||S.myName;
  S.myClass='同仁';
  if(!S.myName){toast('請輸入姓名','err');return;}
  const cartKeys=Object.keys(S.cart);
  if(!cartKeys.length){toast('請至少選一項','err');return;}
  // 防止重複點餐：檢查同場次是否已有相同姓名
  const existingOrder=(S.orders[S.activeEventId]||[]).find(o=>o.user_name===S.myName);
  if(existingOrder){
    // 顯示確認對話框
    const confirmed=await showDuplicateWarning(S.myName, existingOrder);
    if(!confirmed) return;
  }
  const noteEl=document.getElementById('orderNote');
  const total=cartKeys.reduce((s,k)=>s+S.cart[k].price*S.cart[k].qty,0);
  const orderNote=noteEl?.value.trim()||'';
  const orderFlowBox=await showFinalOrderConfirmation(ev,S.myName,cartKeys,orderNote);
  if(!orderFlowBox) return;
  const orderPayload={menu_id:S.activeEventId,user_name:S.myName,class_name:S.myClass,note:orderNote,total};
  const itemsPayload=cartKeys.map(k=>{const ci=S.cart[k];return{item_id:ci.itemId,item_name:ci.name,item_emoji:ci.emoji,quantity:ci.qty,unit_price:ci.price,specs_str:ci.specsStr,note:ci.note};});
  document.getElementById('subBtn').disabled=true;
  const{error}=await dbInsertOrder(orderPayload,itemsPayload);
  if(error){
    toast('送出失敗：'+error.message,'err');
    document.getElementById('subBtn').disabled=false;
    const confirmBtn=orderFlowBox.querySelector('#finalOrderConfirm');
    const cancelBtn=orderFlowBox.querySelector('#finalOrderCancel');
    if(confirmBtn){confirmBtn.disabled=false;confirmBtn.textContent='✅ 確認送出';}
    if(cancelBtn) cancelBtn.disabled=false;
    return;
  }
  S.cart={};
  // 重新載入場次，讓「查看已送出的餐點」立即出現。
  await loadEventDetail(S.activeEventId);
  orderFlowBox.remove();
  render();
  toast('點餐已成功送出 ✓','ok');
}

function doQuery(){
  const name=document.getElementById('qName')?.value.trim()||'';
  const cls=document.getElementById('qClass')?.value||'';
  S.myName=name; S.myClass=cls;
  const results=[];
  S.events.forEach(ev=>{
    const ords=S.orders[ev.id]||[];
    ords.forEach(o=>{
      if(name&&!o.user_name.includes(name)) return;
      if(cls&&o.class_name!==cls) return;
      results.push({ev,o});
    });
  });
  S.myRecs=results; render();
}
async function doDelete(id,menuId){
  const{error}=await dbDeleteOrder(id,menuId);
  if(error){toast('刪除失敗','err');return;}
  S.delId=null;
  S.myRecs=(S.myRecs||[]).filter(r=>r.o.id!==id);
  toast('已取消點餐紀錄','ok'); render();
}

function renderParseCheckStatus(){
  const state=S.parseStatus||'idle';
  if(state==='idle') return '';
  const cfg={
    ready:{bg:'var(--aml)',color:'#92400e',text:'⏳ 已選擇菜單，尚未執行一鍵解析'},
    parsing:{bg:'var(--inl)',color:'var(--in)',text:'🤖 一鍵解析進行中，請勿儲存'},
    complete:{bg:'var(--grl)',color:'var(--gr)',text:'✅ 已完成一鍵解析，並與歷史菜單比對'},
    failed:{bg:'var(--rdl)',color:'var(--rd)',text:'❌ 解析未完成，請重新執行一鍵解析'}
  }[state];
  if(!cfg) return '';
  const changes=(S.parseComparison||[]).reduce((sum,g)=>sum+g.added.length+g.removed.length+g.changed.length,0);
  const extra=state==='complete'?`；共發現 ${changes} 項差異`:'';
  return `<div style="background:${cfg.bg};color:${cfg.color};border-radius:var(--rsm);padding:8px 11px;margin:8px 0 10px;font-size:.74rem;font-weight:700">${cfg.text}${extra}</div>`;

function splitHistoryEntries(entries){
  const result=[];
  (Array.isArray(entries)?entries:[]).forEach((entry,sourceIndex)=>{
    const groups={便當:[],飲料:[]};
    (Array.isArray(entry.items)?entry.items:[]).forEach(item=>{
      const category=item.category||'';
      // 舊版快取可能把同店便當、飲料存在同一筆；顯示前先依品項分類拆開。
      const type=category==='飲料'||(!category&&entry.type==='飲料')?'飲料':'便當';
      groups[type].push(item);
    });
    ['便當','飲料'].forEach(type=>{
      if(!groups[type].length) return;
      result.push({...entry,key:(entry.key||('history-'+sourceIndex))+'__'+type,type,items:groups[type],sourceIndex});
    });
  });
  return result;
}

function renderStoreCapsules(currentStore){
  try{
    // 只顯示本場次已解析、已儲存或從右上角歷史菜單載入的項目。
    const currentItems=[...(S.pendingItems||[]),...(((S.items||{})[S.adminEid])||[])];
    const capsuleMap=new Map();
    currentItems.forEach(item=>{
      const store=String(item.restaurant||'').trim();
      if(!store||store==='未知店家'||store==='本日菜單') return;
      const type=item.category==='飲料'||item._uploadType==='drink'?'飲料':'便當';
      const key=normalizeCompareText(store)+'__'+type;
      if(!capsuleMap.has(key)) capsuleMap.set(key,{store,type});
    });
    const currentCapsules=[...capsuleMap.values()];
    if(!currentCapsules.length) return '';

    const buttons=currentCapsules.map(entry=>{
      const isDrink=entry.type==='飲料';
      const active=currentStore===entry.store;
      const color=isDrink?'#3730a3':'#9a3412';
      const light=isDrink?'#eef2ff':'#fff7ed';
      const border=isDrink?'#a5b4fc':'#fdba74';
      return '<button type="button" data-store="'+esc(entry.store)+'" onclick="pickStore(this.dataset.store)" aria-pressed="'+active+'" title="點擊選擇此店家" style="font-size:.72rem;padding:5px 12px;border:1.5px solid '+(active?'var(--or)':border)+';border-radius:999px;background:'+(active?'var(--or)':light)+';color:'+(active?'#fff':color)+';cursor:pointer;font-weight:700;margin:0;display:flex;align-items:center;gap:3px">'+(isDrink?'🧋':'🍱')+' '+esc(entry.store)+' · '+entry.type+'</button>';
    }).join('');
    return '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">'
      +'<span style="font-size:.65rem;color:var(--sll);font-weight:700;white-space:nowrap">本次</span>'+buttons+'</div>';
  }catch(e){return '';}
}

function showHistoryMessage(entry,alreadyAdded=false){
  return new Promise(resolve=>{
    const box=document.createElement('div');
    box.className='modal-bg';
    box.style.zIndex='340';
    const isDrink=entry.type==='飲料';
    box.innerHTML=`<div class="modal-box" style="max-width:360px">
      <div style="font-size:2rem;margin-bottom:7px">${isDrink?'🧋':'🍱'}</div>
      <div class="modal-title">${alreadyAdded?'此菜單已新增':'確認新增歷史菜單？'}</div>
      <p class="modal-sub" style="line-height:1.7">「${esc(entry.store||'未知店家')}」${esc(entry.type)}菜單，共 ${(entry.items||[]).length} 個品項${alreadyAdded?'<br>為避免重複，本次不會再新增。':''}</p>
      ${alreadyAdded
        ?'<button class="btn btn-out btn-full" data-history-keep>保留菜單</button><button class="btn btn-rd btn-full" style="margin-top:7px" data-history-delete>刪除誤按的菜單</button>'
        :'<button class="btn btn-or btn-full" data-history-add>確認新增</button><button class="btn btn-out btn-full" style="margin-top:7px" data-history-cancel>取消</button>'}
    </div>`;
    document.body.appendChild(box);
    const finish=value=>{box.remove();resolve(value);};
    box.querySelector('[data-history-keep]')?.addEventListener('click',()=>finish('keep'));
    box.querySelector('[data-history-delete]')?.addEventListener('click',()=>finish('delete'));
    box.querySelector('[data-history-add]')?.addEventListener('click',()=>finish('add'));
    box.querySelector('[data-history-cancel]')?.addEventListener('click',()=>finish('cancel'));
    box.addEventListener('click',e=>{if(e.target===box)finish(alreadyAdded?'keep':'cancel');});
  });
}

async function requestHistoryAddition(entry,closeCache){
  if((S.loadedHistoryKeys||[]).includes(entry.key)){
    const action=await showHistoryMessage(entry,true);
    if(action==='delete'){
      S.pendingItems=(S.pendingItems||[]).filter(item=>item._historyKey!==entry.key);
      S.loadedHistoryKeys=(S.loadedHistoryKeys||[]).filter(key=>key!==entry.key);
      if(closeCache&&window._cacheOverlay){window._cacheOverlay.remove();window._cacheOverlay=null;}
      render();
    }
    return;
  }
  S.loadedHistoryKeys=[...(S.loadedHistoryKeys||[]),entry.key];
  render(); // 先反色，再顯示確認視窗
  const action=await showHistoryMessage(entry,false);
  if(action!=='add'){
    S.loadedHistoryKeys=(S.loadedHistoryKeys||[]).filter(key=>key!==entry.key);
    render();
    return;
  }
  const ev=S.events.find(e=>e.id===S.adminEid);
  if(ev) ev.store_name=entry.store||'';
  const loaded=(entry.items||[]).map((it,i)=>({...it,id:'cache-'+Date.now()+'-'+i,menu_id:S.adminEid,ai_parsed:false,_historyKey:entry.key}));
  S.pendingItems=[...S.pendingItems,...loaded];
  if(closeCache&&window._cacheOverlay){window._cacheOverlay.remove();window._cacheOverlay=null;}
  render();
}

async function saveMenu(){
  const eid=S.adminEid; if(!eid){toast('請先選擇場次','err');return;}
  if(DEMO){toast('示範模式：變更不會寫入','warn');return;}

  if(S.parseStatus==='parsing'){toast('一鍵解析仍在進行中，完成後才能儲存','warn');return;}
  if(hasSelectedFiles&&S.parseStatus!=='complete'){
    toast(S.parseStatus==='failed'?'一鍵解析未完成，請重新解析':'已選擇菜單，請先按「一鍵解析」','warn');
    return;
  }
  if(S.parseStatus==='complete'){
    // 儲存前再依目前畫面中的解析結果重算，避免使用已過期的比對摘要。
    S.parseComparison=compareParsedWithHistory(S.parseRunId);
    const counts=(S.parseComparison||[]).reduce((sum,g)=>({added:sum.added+g.added.length,removed:sum.removed+g.removed.length,changed:sum.changed+g.changed.length}),{added:0,removed:0,changed:0});
    if(!confirm(`已確認完成一鍵解析與歷史比對。\n新增 ${counts.added} 項、歷史未出現 ${counts.removed} 項、價格或規格變更 ${counts.changed} 項。\n\n確定儲存本次解析結果？`)) return;
  }else if(S.pendingItems.length){
    if(!confirm('本次品項來自歷史菜單或手動新增，尚未執行一鍵解析。\n確定仍要儲存？')) return;
  }
  // 「儲存」會保留目前畫面上的場次設定；若有新菜單品項則一併儲存。
  // 不變更 is_closed，因此不會把場次移到後台或從前台隱藏。
  const date=document.getElementById('evDate')?.value||'';
  const title=document.getElementById('evTitle')?.value.trim();
  const activity_note=document.getElementById('evActivityNote')?.value.trim()||'';
  const store_name=document.getElementById('evStore')?.value.trim()||'';
  const orgInput=document.getElementById('evOrganizer')?.value.trim()||'';
  const evNow=S.events.find(e=>e.id===eid);
  const organizer=orgInput||evNow?.organizer||'';
  if(!date){toast('請選擇場次日期','err');return;}
  if(!title){toast('請填場次標題','err');return;}
  const{data:settingRows,error:settingError}=await sb.from('menus')
    .update({date,title,activity_note,organizer,store_name})
    .eq('id',eid)
    .select('id');
  if(settingError||!settingRows?.length){
    toast('設定儲存失敗：'+(settingError?.message||'資料未更新'),'err');
    return;
  }
  if(evNow) Object.assign(evNow,{date,title,activity_note,organizer,store_name});
  if(!S.pendingItems.length){
    toast('✅ 目前畫面設定已儲存','ok');
    render();
    return;
  }

  // 把 pendingItems 讀取欄位後 append 到資料庫（不刪除既有品項）
  const existingCount=(S.items[eid]||[]).length;
  const newItems=S.pendingItems.map((it,i)=>({
    emoji:document.getElementById('me-'+i)?.value||it.emoji,
    category:document.getElementById('mc-'+i)?.value||it.category||'其他',
    restaurant:document.getElementById('mr-'+i)?.value||it.restaurant,
    name:document.getElementById('mn-'+i)?.value||it.name,
    price:(()=>{const v=document.getElementById('mp-'+i)?.value;return v!==undefined&&v!==''?+v:it.price;})(),
    description:document.getElementById('md-'+i)?.value||it.description||'',
    specs:it.specs||[],          // specs 直接從 state 讀取（已即時更新）
    sort_order:existingCount+i,
    ai_parsed:true,
    menu_id:eid
  }));

  if(newItems.length){
    const{error:e2}=await sb.from('menu_items').insert(newItems);
    if(e2){toast('品項儲存失敗：'+e2.message,'err');return;}
    S.pendingItems=[];
    await loadEventDetail(eid);
    const total=(S.items[eid]||[]).length;
    // 快取到 localStorage（便當和飲料分開）
    try{
      const cached=JSON.parse(localStorage.getItem('menuCache')||'[]');
      const allItems=S.items[eid]||[];
      const storeRaw=(document.getElementById('evStore')?.value.trim()||evNow?.store_name||'').replace('未知店家','').trim();
      const date=new Date().toLocaleDateString('zh-TW');
      const bentoCats=['便當','點心'];
      // 每個店家獨立存快取（依 restaurant 欄位分組）
      const storeGroups={};
      allItems.forEach(it=>{
        const s=it.restaurant||storeRaw;
        if(!s) return;
        if(!storeGroups[s]) storeGroups[s]={bento:[],drink:[]};
        if((it.category||'其他')==='飲料') storeGroups[s].drink.push(it);
        else if(bentoCats.includes(it.category||'其他')) storeGroups[s].bento.push(it);
      });
      Object.entries(storeGroups).forEach(([sName,{bento,drink}])=>{
        if(bento.length){
          const k=sName+'__便當';
          const bi=cached.findIndex(c=>c.key===k);
          const be={key:k,store:sName,type:'便當',items:bento,savedAt:date};
          if(bi>=0) cached[bi]=be; else cached.unshift(be);
        }
        if(drink.length){
          const k=sName+'__飲料';
          const di=cached.findIndex(c=>c.key===k);
          const de={key:k,store:sName,type:'飲料',items:drink,savedAt:date};
          if(di>=0) cached[di]=de; else cached.unshift(de);
        }
      });
      localStorage.setItem('menuCache',JSON.stringify(cached.slice(0,20)));
    }catch(e){}
    S.parseStatus='idle';
    S.parseComparison=null;
    S.parseRunId=null;
    window._pendingMainFile=null;
    window._pendingDrinkFile=null;
    toast('✅ 設定與菜單已儲存！本場次共 '+total+' 個品項','ok');
  }
  render();
  // 儲存後更新店家膠囊
  setTimeout(()=>{
    const capsDiv=document.getElementById('storeCapsules');
    if(capsDiv) capsDiv.innerHTML=renderStoreCapsules(document.getElementById('evStore')?.value||'');
  },100);
}

// 開始解析：用之前選好的檔案
function startParse(uploadType){
